name: Build PulsePods IPA

on:
  push:
    paths:
      - "PulsePods/**"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: PulsePods
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project PulsePods.xcodeproj -scheme PulsePods \
            -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/PulsePods.app
          codesign --force --sign - --entitlements PulsePods.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry PulsePods.ipa Payload
          ls -lh PulsePods.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PulsePods-ipa
          path: PulsePods/PulsePods.ipa

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pulsepods-build-${{ github.run_number }}
          name: PulsePods build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: PulsePods/PulsePods.ipa
