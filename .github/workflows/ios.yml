name: Build iOS app

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project GlucoseHelper.xcodeproj \
            -target GlucoseHelper \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error|warning: |BUILD" || true
          test -d build/Release-iphoneos/GlucoseHelper.app

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/GlucoseHelper.app Payload/
          zip -qry T1DHelper.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: T1DHelper-ipa
          path: ios/T1DHelper.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: T1D Helper build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: Unsigned IPA. Download on your iPhone and sign it with your certificate.
          files: ios/T1DHelper.ipa
