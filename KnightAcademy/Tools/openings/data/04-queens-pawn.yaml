  notes:
    "3.Bg5": The Torre pin.
    "4...h6": Questions the bishop.
  ideas:
    - Solid system with a pin.
  tactics:
    - e4–e5 pushes vs pinned knight.
  whitePlans:
    - e4 break, kingside attack.
  blackPlans:
    - ...c5, ...Qb6 pressure.
  mistakes:
    - Ignoring ...Qb6.
  keyPositions:
    - after: "3.Bg5"
      title: Torre pin
      text: The pin on f6 is the basis.
  variations: []

- id: modern-benoni
  name: Modern Benoni
  canonical: "Benoni Defense: Modern Variation"
  prefixes: ["Benoni Defense"]
  side: black
  difficulty: advanced
