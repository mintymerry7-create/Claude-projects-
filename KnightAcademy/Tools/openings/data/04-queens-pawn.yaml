- id: richter-veresov
  name: Richter-Veresov Attack
  canonical: "Richter-Veresov Attack"
  prefixes: ["Richter-Veresov Attack"]
  side: white
  difficulty: intermediate
  summary: >
    1.d4 Nf6 2.Nc3 d5 3.Bg5 — an aggressive system with f3 and e4 ideas.
  main: 1. d4 Nf6 2. Nc3 d5 3. Bg5 Nbd7 4. Nf3 g6 5. e3 Bg7 6. Bd3 c6 7. O-O O-O 8. Qe2
  notes:
