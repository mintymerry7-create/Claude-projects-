    "3...g6": Leningrad fianchetto.
    "7...Qe8": Prepares ...e5.
  ideas:
    - Kingside attack, ...e5 break.
  tactics:
    - ...Ng4, ...e5 tricks.
  whitePlans:
    - d5, central control.
  blackPlans:
    - ...e5 and kingside play.
  mistakes:
    - Weakening e6.
  keyPositions:
    - after: "3...g6"
      title: Leningrad
      text: Dutch with a fianchetto.
  variations: []

