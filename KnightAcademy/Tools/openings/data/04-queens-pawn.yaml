  notes:
    "2.e4": The gambit.
    "4.f3": Offers a second pawn.
    "10.O-O": White's pieces are active for the pawn.
  ideas:
    - Development and f-file for a pawn.
  tactics:
    - Bxf7 sacrifices, Qxb7 tricks.
  whitePlans:
    - Attack on the kingside.
  blackPlans:
    - Consolidate, return material if needed.
  mistakes:
    - Black being greedy.
  keyPositions:
    - after: "5.Nxf3"
      title: Gambit
      text: White has a lead in development.
  variations: []

- id: englund-gambit
  name: Englund Gambit
  canonical: "Englund Gambit"
  prefixes: ["Englund Gambit"]
  side: black
  difficulty: beginner
  summary: >
    1...e5?! — a dubious gambit with a famous trap. Learning it teaches how to punish
