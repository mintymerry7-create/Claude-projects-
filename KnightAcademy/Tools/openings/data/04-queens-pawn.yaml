  blackPlans:
    - Kingside attack.
  mistakes:
    - Bad light-squared bishop.
  keyPositions:
    - after: "7.Nc3"
      title: Stone wall
      text: Black's pawn chain controls e4.
  variations: []

- id: dutch-classical
  name: Dutch Defense – Classical
  canonical: "Dutch Defense: Classical Variation"
  group: Dutch Defense
  side: black
  difficulty: intermediate
  summary: >
    Black combines ...f5 and ...e6 with ...d6, keeping options for ...e5 and a
    queen maneuver ...Qe8–g6/h5.
  main: 1. d4 f5 2. c4 e6 3. g3 Nf6 4. Bg2 Be7 5. Nf3 O-O 6. O-O d6 7. Nc3 Qe8 8. Re1 Qg6 9. e4 fxe4 10. Nxe4
  notes:
    "2...e6": Classical Dutch.
    "8...Qg6": Queen swings to the kingside.
  ideas:
    - Flexible structure.
  tactics:
    - ...e5 breaks, queen attacks.
  whitePlans:
    - e4 break.
  blackPlans:
    - Kingside attack.
  mistakes:
    - Allowing e4 cheaply.
  keyPositions:
    - after: "2...e6"
      title: Classical Dutch
      text: Black keeps options for ...d5 or ...d6.
  variations: []
  traps:
    - name: Weakened e8–h5 diagonal
      trapper: white
      moves: 1. d4 f5 2. Bg5 h6 3. Bh4 g5 4. Bg3 f4 5. e3 h5 6. Bd3 Rh6 7. Qxh5+ Rxh5 8. Bg6#
      description: Every Dutch player must respect the e8–h5 diagonal. Over-pushing kingside pawns allows a queen sacrifice and a bishop mate.

- id: budapest-gambit
  name: Budapest Gambit
  canonical: "Indian Defense: Budapest Gambit"
  prefixes: ["Indian Defense: Budapest Gambit"]
  side: black
  difficulty: intermediate
  summary: >
    2...e5 sacrifices a pawn to activate pieces quickly. Black usually regains it on
    e5 with good development.
  main: 1. d4 Nf6 2. c4 e5 3. dxe5 Ng4 4. Bf4 Nc6 5. Nf3 Bb4+ 6. Nbd2 Qe7 7. e3 Ngxe5 8. Nxe5 Nxe5 9. Be2 O-O 10. O-O
  notes:
    "2...e5": The gambit.
    "3...Ng4": Black regains e5.
    "5...Bb4+": Develops with tempo.
  ideas:
    - Fast development.
  tactics:
    - The Budapest trap Nd3#.
  whitePlans:
    - Keep the pawn and develop calmly.
  blackPlans:
    - Regain e5 with active pieces.
  mistakes:
    - White grabbing the bishop with axb4.
  keyPositions:
    - after: "3...Ng4"
      title: Regaining e5
      text: Black pressures e5 with knights.
  variations: []
  traps:
    - name: Budapest Trap
      trapper: black
      moves: 1. d4 Nf6 2. c4 e5 3. dxe5 Ng4 4. Bf4 Nc6 5. Nf3 Bb4+ 6. Nbd2 Qe7 7. a3 Ngxe5 8. axb4 Nd3#
      description: Taking the bishop allows a smothered mate on d3.

- id: old-indian
  name: Old Indian Defense
  canonical: "Old Indian Defense: Ukrainian Variation"
  prefixes: ["Old Indian Defense"]
  side: black
  difficulty: beginner
  summary: >
    ...d6 and ...e5 with the bishop on e7. Solid but passive; good for players who
