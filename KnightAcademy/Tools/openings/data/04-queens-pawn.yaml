  ideas:
    - e4 break with active pieces.
  tactics:
    - Bxf6 to win d5, e4 pushes.
  whitePlans:
    - f3, e4 and long castling.
  blackPlans:
    - ...c5 or ...Bf5.
  mistakes:
    - Black ignoring e4.
  keyPositions:
    - after: "3.Bg5"
      title: Veresov
      text: White's setup targets e4.
  variations: []
