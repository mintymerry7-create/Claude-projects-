    "3...e5": Central challenge.
  ideas:
    - Solid e5 strongpoint.
  tactics:
    - dxe5 exchanges, d5 squeezes.
  whitePlans:
    - Space with d5.
  blackPlans:
    - ...exd4 or hold e5; ...Re8, ...Bf8.
  mistakes:
    - Passivity.
  keyPositions:
    - after: "3...e5"
      title: Strongpoint
      text: Black holds e5.
  variations: []

- id: blackmar-diemer
  name: Blackmar-Diemer Gambit
  canonical: "Blackmar-Diemer Gambit"
  prefixes: ["Blackmar-Diemer Gambit"]
