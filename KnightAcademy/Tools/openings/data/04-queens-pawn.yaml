    "4...exd5": Creates the Benoni structure.
    "6...g6": The bishop goes to g7.
  ideas:
    - Queenside majority vs central majority.
  tactics:
    - e5 pushes by White, ...b5 sacrifices by Black.
  whitePlans:
    - e5 break.
  blackPlans:
    - ...b5 expansion.
  mistakes:
    - Allowing e5 at a bad moment.
  keyPositions:
    - after: "5...d6"
      title: Benoni structure
      text: Asymmetrical and dynamic.
  variations: []

- id: benko-gambit
  name: Benko Gambit
  canonical: "Benko Gambit"
  prefixes: ["Benko Gambit"]
  side: black
  difficulty: intermediate
  summary: >
    Black sacrifices the b-pawn for open a- and b-files and long-term queenside
    pressure — a positional gambit.
  main: 1. d4 Nf6 2. c4 c5 3. d5 b5 4. cxb5 a6 5. bxa6 Bxa6 6. Nc3 d6 7. e4 Bxf1 8. Kxf1 g6 9. g3 Bg7 10. Kg2 O-O 11. Nf3 Nbd7
  notes:
    "3...b5": The gambit.
    "5...Bxa6": Open files for rooks.
    "7...Bxf1": White cannot castle.
  ideas:
    - Long-term queenside pressure.
  tactics:
    - Pressure on a2, b2.
  whitePlans:
    - Consolidate the extra pawn.
  blackPlans:
    - Rooks on a- and b-files.
  mistakes:
    - Black trading the wrong pieces.
  keyPositions:
    - after: "5...Bxa6"
      title: Open files
      text: Black's compensation is positional.
  variations: []

- id: dutch-leningrad
  name: Dutch Defense – Leningrad
  canonical: "Dutch Defense: Leningrad Variation"
