  main: 1. d4 e5 2. dxe5 Nc6 3. Nf3 Qe7 4. Bf4 Qb4+ 5. Bd2 Qxb2 6. Nc3 Bb4 7. Rb1 Qa3 8. Rb3 Qa5
  notes:
    "1...e5": The Englund.
    "3...Qe7": Attacks e5 and sets the trap.
    "6.Nc3": The correct defence.
