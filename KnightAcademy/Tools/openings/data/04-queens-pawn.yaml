      title: Trap set
      text: Black hits e5 and prepares ...Qb4+.
  variations: []
  traps:
    - name: Englund Gambit Trap
      trapper: black
      moves: 1. d4 e5 2. dxe5 Nc6 3. Nf3 Qe7 4. Bf4 Qb4+ 5. Bd2 Qxb2 6. Bc3 Bb4 7. Qd2 Bxc3 8. Qxc3 Qc1#
