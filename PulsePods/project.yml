name: PulsePods
options:
  bundleIdPrefix: com.pulsepods
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PulsePods:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements:
      path: PulsePods.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PulsePods
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: "PulsePods lit ta fréquence cardiaque (AirPods / Apple Watch) pour l'afficher en direct et calculer moyennes et pics."
        NSHealthUpdateUsageDescription: "PulsePods démarre une séance pour activer le capteur cardiaque des AirPods."
        UIBackgroundModes: [workout-processing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsepods.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_PREVIEWS: "NO"
