<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name</title>
  <meta name="description" content="Personal site.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ea;
      --text: #1d1c1a;
      --muted: #6b675f;
      --rule: #d8d2c4;
      --link: #b3401e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Newsreader", Georgia, serif;
      font-size: 20px;
      line-height: 1.55;
    }
    main { max-width: 620px; margin: 0 auto; padding: 72px 20px 48px; }
    a { color: var(--link); text-underline-offset: 3px; }
    a:hover { text-decoration-thickness: 2px; }
    .mono { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--muted); }

    header { margin-bottom: 56px; }
    h1 { font-weight: 500; font-size: 30px; letter-spacing: -0.01em; }
    header .mono { margin-top: 4px; }

    section { margin-bottom: 48px; }
    h2 {
      font-family: "IBM Plex Mono", monospace; font-weight: 400;
      font-size: 13px; color: var(--muted); text-transform: lowercase;
      border-bottom: 1px solid var(--rule); padding-bottom: 6px; margin-bottom: 16px;
    }
    p + p { margin-top: 14px; }
    .empty { color: var(--muted); font-style: italic; }

    ul { list-style: none; }
    li { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; }

    footer { margin-top: 72px; }

    @media (max-width: 480px) {
      body { font-size: 18px; }
      main { padding-top: 48px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Your Name</h1>
      <p class="mono">city · learning to code</p>
    </header>

    <section>
      <h2>about</h2>
      <p>A few lines about you, in your own words. What you're into, what you're learning, what you want to make.</p>
    </section>

    <section>
      <h2>projects</h2>
      <p class="empty">Nothing here yet. First project in progress.</p>
    </section>

    <section>
      <h2>contact</h2>
      <ul>
        <li><span>Email</span><a href="mailto:you@example.com">you@example.com</a></li>
        <li><span>GitHub</span><a href="https://github.com/">github.com/username</a></li>
      </ul>
    </section>

    <footer class="mono">updated <span id="year"></span></footer>
  </main>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
