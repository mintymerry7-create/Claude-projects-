name: GlucoseHelper
options:
  bundleIdPrefix: com.mintymerry
  deploymentTarget:
    iOS: "17.0"
targets:
  GlucoseHelper:
    type: application
    platform: iOS
    sources: [GlucoseHelper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mintymerry.glucosehelper
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "T1D Helper"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
